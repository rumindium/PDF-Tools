# Redis for PDF Tools: BullMQ queues, job progress pub/sub, per-minute counters, worker heartbeats.
#
# The persistence policy is a deliberate cost decision, not a default (docs/0-CICD.md §9):
#
#   * AOF is on with `everysec`, so an in-flight queue survives a restart. Losing queued jobs would mean telling a
#     user their job vanished for no reason they could see.
#   * `save` snapshots are kept as well, because a full AOF replay on a large keyspace is slower than loading an
#     RDB and then replaying the tail.
#   * This is *not* a system of record. Job history, results, and usage all live in Postgres; nothing here is
#     backed up, and a total Redis loss is survivable (documented, and the API reports `WORKER_UNAVAILABLE`
#     rather than leaving a job QUEUED forever).

bind 0.0.0.0
protected-mode no
port 6379

# ── Persistence ─────────────────────────────────────────────────────────────
appendonly yes
appendfsync everysec
appendfilename "pdftools.aof"
dir /data
save 900 1
save 300 10
save 60 10000

# ── Memory ──────────────────────────────────────────────────────────────────
# Payloads, not documents: a job payload holds file metadata and a path, never bytes. A few hundred MB is
# generous for thousands of queued jobs, so an eviction here means a bug rather than load.
maxmemory 512mb
maxmemory-policy noeviction

# ── Connection behaviour ────────────────────────────────────────────────────
# BullMQ needs blocking commands (BRPOPLPUSH) not to time out. This matters because a client that reconnects
# mid-claim can otherwise duplicate work — which is exactly what the per-job lock exists to make harmless.
timeout 0
tcp-keepalive 60

# ── Observability ───────────────────────────────────────────────────────────
# Slowlog is how "the queue felt slow" turns into a command with a duration.
slowlog-log-slower-than 10000
slowlog-max-len 256

# ── Safety ──────────────────────────────────────────────────────────────────
# No Lua evaluation from arbitrary clients: BullMQ sends its own scripts, and everything else talking to this
# instance is ours.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
